<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>北疆伊犁 · 八日牧歌</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: #1A2533; }
  .cover-bg-img {
    position: absolute; inset: 0;
    background: url('https://images.pexels.com/photos/17804518/pexels-photo-17804518.jpeg?auto=compress&cs=tinysrgb&w=1200') center/cover no-repeat;
  }
  .cover-overlay-strong {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,37,51,0.15) 0%, rgba(26,37,51,0.65) 50%, rgba(26,37,51,0.92) 100%);
  }
  .hero-icon { font-size: 90px; margin-bottom: 20px; }
  .divider { width: 100px; height: 4px; background: var(--gold); margin: 36px auto; border-radius: 2px; }
  .route-map { margin: 40px auto 0; width: 950px; height: 240px; opacity: 0.9; }
  .bottom-bar { position: absolute; bottom: 100px; left: 0; right: 0; text-align: center; z-index: 3; }
</style>
</head>
<body>
<div class="card">
  <div class="cover-bg-img"></div>
  <div class="cover-overlay-strong"></div>

  <div class="cover-content" style="position:relative;z-index:2;">
    <div class="hero-icon">🏔️</div>
    <div class="cover-tagline">XINJIANG TRAVEL GUIDE · 2026</div>
    <div class="cover-title">北疆伊犁</div>
    <div class="cover-hook">8天7晚 · 人均 ¥3,700</div>
    <div class="divider"></div>
    <div class="cover-sub">从赛里木湖到那拉提<br>穿越天山腹地的八日牧歌</div>
    <div class="cover-tags">
      <span>赛里木湖</span><span>伊昭公路</span><span>夏塔古道</span><span>喀拉峻</span><span>那拉提</span>
    </div>

    <svg class="route-map" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#D4A853"/>
          <stop offset="50%" stop-color="#E8A060"/>
          <stop offset="100%" stop-color="#C85A32"/>
        </linearGradient>
      </defs>
      <!-- 主路线曲线 -->
      <path d="M 40,120 C 140,40 200,140 320,80 C 420,30 480,130 580,70 C 660,20 720,110 840,60"
            stroke="url(#rg)" stroke-width="2.5" fill="none"
            stroke-dasharray="10,5" stroke-linecap="round" opacity="0.9"/>
      <!-- 浅色底影路线 -->
      <path d="M 40,120 C 140,40 200,140 320,80 C 420,30 480,130 580,70 C 660,20 720,110 840,60"
            stroke="rgba(255,255,255,0.12)" stroke-width="6" fill="none"
            stroke-linecap="round"/>

      <!-- 起点：伊宁 ✈️ -->
      <circle cx="40" cy="120" r="14" fill="#D4A853" stroke="#fff" stroke-width="3"/>
      <text x="40" y="98" text-anchor="middle" fill="#D4A853" font-size="28">✈️</text>
      <text x="40" y="162" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="19" font-weight="600">伊宁出发</text>

      <!-- 赛里木湖 -->
      <circle cx="180" cy="75" r="11" fill="#C85A32" stroke="#fff" stroke-width="2.5"/>
      <text x="180" y="112" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="19">赛里木湖</text>

      <!-- 伊昭公路 -->
      <circle cx="320" cy="80" r="11" fill="#C85A32" stroke="#fff" stroke-width="2.5"/>
      <text x="320" y="118" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="19">伊昭公路</text>

      <!-- 夏塔古道 -->
      <circle cx="460" cy="50" r="11" fill="#C85A32" stroke="#fff" stroke-width="2.5"/>
      <text x="460" y="40" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="19">夏塔古道</text>

      <!-- 喀拉峻 -->
      <circle cx="580" cy="70" r="11" fill="#C85A32" stroke="#fff" stroke-width="2.5"/>
      <text x="580" y="108" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="19">喀拉峻</text>

      <!-- 终点：那拉提 ⭐ -->
      <circle cx="740" cy="30" r="16" fill="#D4A853" stroke="#fff" stroke-width="3"/>
      <text x="740" y="26" text-anchor="middle" fill="#fff" font-size="21">⭐</text>
      <text x="740" y="68" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="21" font-weight="700">那拉提</text>
      <text x="820" y="68" text-anchor="start" fill="rgba(255,255,255,0.45)" font-size="16">终点</text>

      <!-- 小装饰点：沿路散布 -->
      <circle cx="110" cy="100" r="3" fill="rgba(255,255,255,0.3)"/>
      <circle cx="260" cy="60" r="3" fill="rgba(255,255,255,0.3)"/>
      <circle cx="390" cy="95" r="3" fill="rgba(255,255,255,0.3)"/>
      <circle cx="530" cy="50" r="3" fill="rgba(255,255,255,0.3)"/>
      <circle cx="670" cy="85" r="3" fill="rgba(255,255,255,0.3)"/>
    </svg>
  </div>

  <div style="position:absolute;bottom:130px;left:0;right:0;text-align:center;z-index:3;font-size:16px;color:rgba(255,255,255,0.35);">📷 封面背景来自图库，非实拍</div>
  <div class="bottom-bar"><div class="cover-footer">2026.8.11 — 8.18 · 情侣出行 · 自然美食休闲</div></div>
  <div class="sig" style="position:relative;z-index:3;color:rgba(255,255,255,0.4);">@AiBytes</div>
  <div class="progress" style="position:relative;z-index:3;"><span class="active"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
</body>
</html>
