<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>预算一览</title>
<link rel="stylesheet" href="shared.css">
<style>body{background:linear-gradient(180deg,#FBF5ED 0%,#FFFEFC 100%)}</style>
</head>
<body>
<div class="card">
  <div class="day-header">
    <div class="day-header-left">
      <div class="budget-header" style="padding:0;">
        <div class="bh-label">BUDGET BREAKDOWN</div>
        <div class="bh-title">💰 钱都花哪了</div>
        <div class="bh-sub">人均预算估算（不含机票约 ¥2,000-2,500）</div>
      </div>
    </div>
    <div class="day-pn">11/12</div>
  </div>

  <div class="total-badge">
    <div class="tb-num">¥3,700</div>
    <div class="tb-label">人均总预算 · 含往返机票</div>
  </div>

  <div class="bars-section">
    <div class="bar-row"><div class="bar-label">✈️ 往返机票</div><div class="bar-track"><div class="bar-fill c1">¥1,200-1,500</div></div><div class="bar-amount">最大头</div></div>
    <div class="bar-row"><div class="bar-label">🏨 住宿 7晚</div><div class="bar-track"><div class="bar-fill c2">¥350-700</div></div><div class="bar-amount">经济酒店</div></div>
    <div class="bar-row"><div class="bar-label">🎫 门票+区间车</div><div class="bar-track"><div class="bar-fill c3">¥660</div></div><div class="bar-amount">4大景区</div></div>
    <div class="bar-row"><div class="bar-label">🚌 当地交通</div><div class="bar-track"><div class="bar-fill c4">¥450-550</div></div><div class="bar-amount">大巴+拼车</div></div>
    <div class="bar-row"><div class="bar-label">🍜 餐饮 8天</div><div class="bar-track"><div class="bar-fill c5">¥500-640</div></div><div class="bar-amount">约60-80/天</div></div>
    <div class="bar-row"><div class="bar-label">🛍️ 购物+其他</div><div class="bar-track"><div class="bar-fill c6">¥100-200</div></div><div class="bar-amount">干果特产</div></div>
  </div>

  <div class="tips-section">
    <h4>💡 省钱 Tips</h4>
    <span class="tip-row">提前1-3天购大巴票</span>
    <span class="tip-row">拼车比包车省一半</span>
    <span class="tip-row">夜市吃饭性价比很高</span>
    <span class="tip-row">干果去农贸市场买</span>
    <span class="tip-row">2人点半份菜刚好</span>
    <span class="tip-row">选含行李额航司</span>
  </div>

  <div class="sig">@AiBytes</div>
  <div class="progress"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span class="active"></span><span></span></div>
</div>
</body>
</html>
